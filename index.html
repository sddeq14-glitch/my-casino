<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>My Casino</title>
<style>
  body { font-family: system-ui; max-width: 420px; margin: 40px auto; padding: 20px; background: #111; color: white; }
  input, button { padding: 10px; margin: 6px 0; width: 100%; box-sizing: border-box; border-radius: 6px; border: 1px solid #333; background: #222; color: white; }
  button { background: #22c55e; color: white; border: none; cursor: pointer; font-weight: bold; font-size: 16px; }
  button:hover { background: #16a34a; }
  #result { background: #222; padding: 12px; margin-top: 16px; white-space: pre-wrap; border-radius: 6px; font-family: monospace; }
</style>
</head>
<body>
<h2>🎲 My Casino</h2>
<input id="wallet" placeholder="Твой кошелёк" value="demo_player_1">
<input id="clientSeed" placeholder="Client seed" value="my_seed_123">
<input id="bet" type="number" value="10" min="1">
<input id="target" type="number" value="50" min="2" max="98">
<label><input type="checkbox" id="betOver" checked> Ставка на «больше»</label>
<button onclick="play()">Играть</button>
<div id="result">Результат появится здесь.</div>

<script>
const API = 'https://my-casino-xi.vercel.app/api';

async function play() {
  const wallet = document.getElementById('wallet').value;
  const clientSeed = document.getElementById('clientSeed').value;
  const betAmount = Number(document.getElementById('bet').value);
  const target = Number(document.getElementById('target').value);
  const betOver = document.getElementById('betOver').checked;
  
  const resultDiv = document.getElementById('result');
  resultDiv.textContent = 'Загрузка...';
  
  try {
    const res = await fetch(`${API}/dice`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ wallet, clientSeed, betAmount, target, betOver }),
    });
    
    const text = await res.text();
    try {
      const data = JSON.parse(text);
      resultDiv.textContent = JSON.stringify(data, null, 2);
    } catch (e) {
      resultDiv.textContent = 'Ответ сервера (не JSON): ' + text;
    }
  } catch (e) {
    resultDiv.textContent = 'Ошибка сети: ' + e.message;
  }
}
</script>
</body>
</html>
